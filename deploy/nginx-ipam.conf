# /etc/nginx/sites-available/ipam  ->  ln -s ../sites-available/ipam /etc/nginx/sites-enabled/
# ipam.example.uz ni o'z domeningiz (yoki server IP) bilan almashtiring.

server {
    listen 80;
    server_name ipam.example.uz;
    # Barcha so'rovlar HTTPS'ga
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ipam.example.uz;

    # Let's Encrypt (certbot --nginx) yoki tashkilot sertifikati
    ssl_certificate     /etc/letsencrypt/live/ipam.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ipam.example.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    access_log /var/log/nginx/ipam.access.log;
    error_log  /var/log/nginx/ipam.error.log;

    # Statik fayllarni Nginx o'zi beradi (collectstatic natijasi)
    location /static/ {
        alias /opt/ipam/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
